<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optimizer Map</title>
  <meta name="description" content="勾配降下法に基づく最適化アルゴリズムの系譜を，手法をノード・改善方法をエッジとしたグラフで可視化したマップ">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <header class="toolbar" role="toolbar" aria-label="表示の操作">
      <h1 class="title">Optimizer Map</h1>
      <div class="search">
        <label class="visually-hidden" for="search-input">手法を検索</label>
        <input id="search-input" type="search" list="search-list" placeholder="手法を検索（例: Adam）" autocomplete="off">
        <datalist id="search-list"></datalist>
      </div>
      <div class="pattern">
        <label class="visually-hidden" for="pattern-select">改良パターンで強調</label>
        <select id="pattern-select" title="同じ改良パターンのエッジをマップ全体で強調"></select>
      </div>
      <div class="toolbar-buttons">
        <button type="button" id="btn-fit" title="全体を表示">全体表示</button>
        <button type="button" id="btn-layout" title="配置の切り替え（領域で囲う／分野ごとの列）">配置: 領域</button>
        <button type="button" id="btn-matrix" aria-pressed="false" title="改良パターン × 分野／年代の対応表と改善アイデアの候補">パターン表</button>
        <button type="button" id="btn-compare" aria-pressed="false" title="選んだ手法の比較と系譜の経路">比較（0）</button>
        <button type="button" id="btn-trend" aria-pressed="false" title="分野・改良パターンごとの年次推移">トレンド</button>
        <button type="button" id="btn-table" aria-pressed="false" title="一覧表に切り替え">一覧表</button>
        <details class="menu export-menu" id="export-menu">
          <summary title="BibTeX・CSV・画像の書き出し">書き出し</summary>
          <div class="menu-body" id="export-body"></div>
        </details>
        <button type="button" id="btn-theme" title="配色の切り替え">配色: 自動</button>
      </div>
    </header>

    <nav class="legend" aria-label="分野（クリックで表示/非表示，ホバーで範囲を強調）">
      <ul id="group-legend" class="legend-groups"></ul>
      <details class="menu filter-menu" id="filter-menu">
        <summary title="実用情報による絞り込み">絞り込み</summary>
        <div class="menu-body" id="filter-body"></div>
      </details>
      <div class="year-control">
        <label for="year-slider">年</label>
        <input id="year-slider" type="range" aria-describedby="year-out">
        <output id="year-out" for="year-slider">全期間</output>
        <button type="button" id="btn-play" title="年を進めながら表示する">▶ 再生</button>
      </div>
      <div id="focus-note" class="focus-note" aria-live="polite" hidden></div>
    </nav>

    <main class="stage">
      <div id="graph" class="graph" aria-label="最適化手法の系譜グラフ"></div>
      <div id="table-view" class="table-view" hidden></div>
      <div id="matrix-view" class="table-view matrix-view" hidden></div>
      <div id="compare-view" class="table-view compare-view" hidden></div>
      <div id="trend-view" class="table-view trend-view" hidden></div>
      <div id="size-legend" class="legend-size" aria-label="ノードの大きさ（Citation数）"></div>
      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    </main>

    <aside id="panel" class="panel" aria-live="polite" hidden>
      <button type="button" id="panel-close" class="panel-close" aria-label="詳細を閉じる">×</button>
      <div id="panel-body"></div>
    </aside>

    <p id="status" class="status" role="status">読み込み中…</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
