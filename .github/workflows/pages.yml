name: Deploy Optimizer Map to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "tools/**"
      - "package*.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "data/**"
      - "site/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Validate node data
        run: python tools/validate_nodes.py
      - name: Check update rules render with KaTeX
        run: node tools/check_formulas.mjs
      - name: Build graph.json
        run: python tools/build_graph.py
      - name: Precompute layouts
        run: node tools/precompute_layout.mjs
      - name: Install Chromium for E2E tests
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests
        run: node tests/e2e/smoke.cjs
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
