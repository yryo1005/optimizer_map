name: Discover new optimizers (arXiv + Gemini)

on:
  schedule:
    - cron: "41 4 * * 1"   # 毎週月曜 04:41 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "生成する候補数の上限"
        default: "5"

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Discover candidates from arXiv
        run: python tools/discover_candidates.py --days 14 --top 20
      - name: Generate nodes with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python tools/generate_nodes_gemini.py --limit "${{ github.event.inputs.limit || '5' }}"
      - name: Validate
        run: |
          python tools/validate_nodes.py
          node tools/check_formulas.mjs
      - name: Fetch metadata for new nodes
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python tools/fetch_metadata.py || true
      - name: Rebuild review
        run: python tools/build_review_md.py
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/discover-optimizers
          title: "新しい最適化手法の候補（自動生成）"
          commit-message: "Add optimizer candidates generated by Gemini"
          body: |
            arXiv の新着論文から `tools/discover_candidates.py` で候補を抽出し，`tools/generate_nodes_gemini.py` で手法ノードを生成した．
            - 追加されたノードは `review/nodes_review.md` で内容（概要・更新式・派生元と改良パターン）を確認すること．
            - 不採用の候補と理由は `data/candidates/rejected.json` にある．
