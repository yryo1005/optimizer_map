name: Check reference links

on:
  schedule:
    - cron: "23 5 15 * *"   # 毎月15日 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links
        id: check
        run: python tools/check_links.py --report link-report.md
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.md
      - name: Open an issue when links are broken
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "参考文献のリンク切れ" --body-file link-report.md
